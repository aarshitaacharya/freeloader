# Daily-dev stack. From the repo root:  make init && make up
name: freeloader

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: freeloader
      POSTGRES_DB: freeloader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freeloader}
    ports: ["127.0.0.1:5433:5432"]   # host port 5433 so it can't clash with a local Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freeloader -d freeloader"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path=/migrations", "-database=postgres://freeloader:${POSTGRES_PASSWORD:-freeloader}@postgres:5432/freeloader?sslmode=disable", "up"]
    volumes: ["../../migrations:/migrations:ro"]
    depends_on:
      postgres: {condition: service_healthy}

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.5
    command:
      - redpanda
      - start
      - --mode=dev-container          # single broker for local dev
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["127.0.0.1:19092:19092"]   # for rpk and other tools on the host
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 3s
      timeout: 5s
      retries: 30

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.5
    # Idempotent: only creates the topic if it is missing, so `up` can be re-run safely.
    entrypoint: ["sh", "-c", "rpk -X brokers=redpanda:9092 topic describe llm.usage >/dev/null 2>&1 || rpk -X brokers=redpanda:9092 topic create llm.usage --partitions 6 --topic-config retention.ms=604800000"]
    restart: "no"
    depends_on:
      redpanda: {condition: service_healthy}

  fl-cache:
    build: {context: ../.., dockerfile: cache/Dockerfile}
    image: fl-cache:dev
    ports: ["127.0.0.1:6400:6400", "127.0.0.1:9400:9400"]

  gateway:
    build: {context: ../../gateway}
    image: fl-gateway:dev
    environment:
      DATABASE_URL: postgres://freeloader:${POSTGRES_PASSWORD:-freeloader}@postgres:5432/freeloader?sslmode=disable
      FL_CACHE_ADDR: fl-cache:6400
      FL_KAFKA_BROKERS: redpanda:9092
      FL_CONFIG: /etc/freeloader/providers.yaml
    env_file:
      - path: ../../.env        # provider API keys; optional so `up` works before you have keys
        required: false
    volumes: ["../../config:/etc/freeloader:ro"]
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:8080"]   # set GATEWAY_PORT in .env if 8080 is taken
    depends_on:
      migrate: {condition: service_completed_successfully}
      fl-cache: {condition: service_started}
      # Topic must exist before events flow. The gateway itself starts fine without a broker.
      redpanda-init: {condition: service_completed_successfully}

  # Control panel: static files, with /admin proxied to the gateway (same origin, no CORS).
  panel:
    build: {context: ../../panel}
    image: fl-panel:dev
    environment:
      GATEWAY_UPSTREAM: http://gateway:8080
    ports: ["127.0.0.1:${PANEL_PORT:-3001}:8080"]
    depends_on:
      gateway: {condition: service_started}

  # Two replicas of the same consumer group: Kafka splits the 6 partitions between them.
  ledger:
    build: {context: ../../ledger}
    image: fl-ledger:dev
    environment:
      DATABASE_URL: postgres://freeloader:${POSTGRES_PASSWORD:-freeloader}@postgres:5432/freeloader?sslmode=disable
      FL_KAFKA_BROKERS: redpanda:9092
      FL_LEDGER_COMMIT_INTERVAL: ${FL_LEDGER_COMMIT_INTERVAL:-1s}
    deploy: {replicas: 2}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redpanda-init: {condition: service_completed_successfully}

  guard:
    build: {context: ../../guard}
    image: fl-guard:dev
    environment:
      FL_KAFKA_BROKERS: redpanda:9092
      FL_CACHE_ADDR: fl-cache:6400
      FL_CONFIG: /etc/freeloader/providers.yaml
    volumes: ["../../config:/etc/freeloader:ro"]
    depends_on:
      redpanda-init: {condition: service_completed_successfully}
      fl-cache: {condition: service_started}

volumes:
  pgdata:
