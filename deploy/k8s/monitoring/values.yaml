# kube-prometheus-stack, trimmed for a local kind cluster.
fullnameOverride: kps
alertmanager: {enabled: false}
nodeExporter: {enabled: false}
kubeStateMetrics: {enabled: false}
kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy: {enabled: false}
defaultRules: {create: false}
prometheus:
  prometheusSpec:
    retention: 6h
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources: {requests: {cpu: 100m, memory: 400Mi}, limits: {memory: 1Gi}}
grafana:
  admin: {existingSecret: grafana-admin, userKey: user, passwordKey: password}
  defaultDashboardsEnabled: false
  sidecar:
    dashboards: {enabled: true, label: grafana_dashboard, searchNamespace: ALL}
  resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 1Gi}}
