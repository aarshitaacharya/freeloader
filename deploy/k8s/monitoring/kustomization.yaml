apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - servicemonitors.yaml
  - alerts.yaml
configMapGenerator:
  - name: freeloader-dashboard
    namespace: monitoring
    files: [freeloader-dashboard.json]
    options:
      disableNameSuffixHash: true
      labels: {grafana_dashboard: "1"}   # the Grafana sidecar loads every ConfigMap with this label
