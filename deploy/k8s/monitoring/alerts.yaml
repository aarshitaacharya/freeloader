apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: {name: freeloader, namespace: freeloader}
spec:
  groups:
    - name: freeloader
      rules:
        - alert: FreeloaderTargetDown
          expr: up{namespace="freeloader", job=~"gateway|ledger|guard|fl-cache"} == 0
          for: 1m
          labels: {severity: page}
          annotations: {summary: "{{ $labels.job }} instance {{ $labels.pod }} is not being scraped"}
        - alert: FreeloaderProviderExhausted
          expr: max by (provider) (fl_guard_exhausted) == 1 or max by (provider, model) (fl_guard_model_exhausted) == 1
          labels: {severity: info}
          annotations: {summary: "{{ $labels.provider }} {{ $labels.model }} is over the guard threshold; the router is skipping it until reset"}
        - alert: FreeloaderUsageEventsDropped
          expr: sum(increase(fl_gateway_events_dropped_total[10m])) > 0
          labels: {severity: warn}
          annotations: {summary: "usage events were dropped; ledger totals will be low (ADR 0006)"}
        - alert: FreeloaderLedgerLag
          expr: max(fl_ledger_consumer_lag) > 1000
          for: 5m
          labels: {severity: warn}
          annotations: {summary: "ledger is more than 1000 events behind"}
        - alert: FreeloaderLedgerDBErrors
          expr: sum(increase(fl_ledger_db_errors_total[5m])) > 0
          labels: {severity: warn}
          annotations: {summary: "ledger batch writes to Postgres are failing"}
        - alert: FreeloaderHigh5xx
          expr: sum(rate(fl_gateway_requests_total{status=~"5.."}[5m])) / sum(rate(fl_gateway_requests_total[5m])) > 0.05
          for: 5m
          labels: {severity: page}
          annotations: {summary: "more than 5% of gateway responses are 5xx"}
