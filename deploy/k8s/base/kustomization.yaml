apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: freeloader
resources:
  - namespace.yaml
  - postgres.yaml
  - fl-cache.yaml
  - topic-init.yaml
  - migrate.yaml
  - gateway.yaml
  - ledger.yaml
  - guard.yaml
