# /v1 and /admin -> gateway, everything else -> the control panel.
# ingress-nginx picks the longest matching prefix, so "/" is only the fallback.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: freeloader
  labels: {tier: app}
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"      # SSE must reach the client unbuffered
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - {path: /v1, pathType: Prefix, backend: {service: {name: gateway, port: {name: http}}}}
          - {path: /admin, pathType: Prefix, backend: {service: {name: gateway, port: {name: http}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: panel, port: {name: http}}}}
