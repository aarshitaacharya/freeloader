apiVersion: v1
kind: Service
metadata: {name: mock-provider}
spec:
  selector: {app: mock-provider}
  ports: [{port: 9000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mock-provider}
spec:
  replicas: 1
  selector: {matchLabels: {app: mock-provider}}
  template:
    metadata: {labels: {app: mock-provider}}
    spec:
      containers:
        - name: mock
          image: python:3.13-alpine
          command: ["python", "-u", "/mock/mock_provider.py"]
          ports: [{containerPort: 9000}]
          readinessProbe:
            tcpSocket: {port: 9000}
            periodSeconds: 2
          volumeMounts: [{name: code, mountPath: /mock, readOnly: true}]
      volumes:
        - {name: code, configMap: {name: mock-provider-code}}
