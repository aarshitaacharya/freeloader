# Copy to config/providers.yaml (gitignored) and adjust. No secrets here:
# API keys are read from the environment variables named in `api_key_env`.
#
# Model IDs below were checked against each provider's live /models endpoint on 2026-10-19 and
# change often. Verify them against your own keys before relying on them, e.g.:
#   curl -s https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY"

server:
  listen: ":8080"
  max_attempts: 3          # providers tried per request
  cooldown: 30s            # skip a provider for this long after it returns 429
  attempt_timeout: 30s     # per upstream call; for streams, the wait for the first response headers
  stream_idle_timeout: 60s # a stream silent for this long is cut

cache:
  addr: "localhost:6400"   # overridden by FL_CACHE_ADDR
  timeout: 100ms           # per cache operation; on timeout the gateway serves without the cache

# fl-guard
guard:
  threshold: 0.9   # flag exhausted at 90% of a daily limit

# Usage events (one per request) go to this topic. Normally set via FL_KAFKA_BROKERS;
# leave brokers empty to run without an event stream.
events:
  brokers: []
  topic: llm.usage

providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    # fl-guard flags a provider/model as exhausted at `guard.threshold` of its DAILY limits.
    # Groq limits are per model; these are what https://console.groq.com/settings/limits showed
    # for this account on 2026-10-19. requests_per_minute is informational (the gateway reacts to
    # real 429s with a cooldown instead).
    reset:
      timezone: UTC   # UNVERIFIED (searched 2026-10-20): Groq's docs list RPD but state no reset time; the
                      # reset headers look like a rolling window, in which case a fixed midnight is only an approximation
    limits: {}
    models:
      openai/gpt-oss-20b:  {requests_per_minute: 30, requests_per_day: 1000, tokens_per_day: 200000}
      openai/gpt-oss-120b: {requests_per_minute: 30, requests_per_day: 1000, tokens_per_day: 200000}
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    # Free-tier notes (observed with a free AI Studio key, 2026-10-19): gemini-3.8-flash and
    # gemini-3-flash-preview hung with no response; the 3.1-pro/pro-latest models returned 429 (no free quota);
    # 2.5 models are retired (404). A key from a project with billing enabled but no credit returns 402.
    # Per-model free limits are only shown in the AI Studio dashboard
    # (https://aistudio.google.com/rate-limit); these are what it showed for this project on
    # 2026-10-20. Models that are not listed here are not guarded (e.g. gemini-3.5-flash was
    # not on the page). Limits are per project, so traffic that does not go through the gateway
    # also spends them: the guard only sees what the gateway sends.
    reset:
      timezone: America/Los_Angeles   # "RPD quotas reset at midnight Pacific time" (ai.google.dev)
    limits: {}
    models:
      gemini-3.1-flash-lite: {requests_per_minute: 15, requests_per_day: 500}
      gemini-3.5-flash-lite: {requests_per_minute: 15, requests_per_day: 500}
      gemini-3.6-flash:      {requests_per_minute: 5,  requests_per_day: 20}
      gemini-3.8-flash:      {requests_per_minute: 5,  requests_per_day: 20}
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    # From https://openrouter.ai/docs/api-reference/limits (':free' models):
    # 20 requests/min; 50 requests/day, or 1000/day once at least $10 of credits has been purchased.
    # One quota shared by every ':free' model, so it is a provider-wide limit, not a per-model one.
    # Failed requests count against it too; the guard only sees requests that were answered.
    reset:
      timezone: UTC   # UNVERIFIED (searched 2026-10-20): midnight UTC is documented for key spend limits only, not this cap
    limits:
      requests_per_minute: 20
      requests_per_day: 50

# Each alias is an ordered preference list. An app's provider_priority can reorder/filter it.
aliases:
  fast:
    - {provider: groq,       model: openai/gpt-oss-20b}
    - {provider: gemini,     model: gemini-3.1-flash-lite}
    - {provider: openrouter, model: "minimax/minimax-m3.1-flash:free"}
  smart:
    - {provider: groq,       model: openai/gpt-oss-120b}
    - {provider: gemini,     model: gemini-3.5-flash}
    - {provider: openrouter, model: "xingchen-agi/xing4.0-29b-a4b:free"}
  vision:
    - {provider: gemini,     model: gemini-3.1-flash-lite}
    - {provider: openrouter, model: "nvidia/nemotron-3.5-super-vl:free"}
