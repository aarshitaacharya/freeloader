name: CI

on:
  push:
  pull_request:

jobs:
  cache:
    name: fl-cache (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan, tsan]
    defaults:
      run:
        working-directory: cache
    steps:
      - uses: actions/checkout@v4
      # Recent kernels randomise mmap more than GCC's ThreadSanitizer supports.
      - name: Lower mmap entropy for TSan
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} -j"$(nproc)"
      - run: ctest --preset ${{ matrix.preset }}

  go:
    name: ${{ matrix.module }} (vet, test -race, lint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [gateway, ledger, guard]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}

  gateway-integration:
    name: integration (Postgres, Redpanda, fl-cache containers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - run: docker build -t fl-cache:dev -f cache/Dockerfile .
      - run: go test -tags integration -race -count=1 -timeout 300s ./internal/integration/...
        working-directory: gateway
      - run: go test -tags integration -race -count=1 -timeout 300s ./...
        working-directory: ledger
      - run: go test -tags integration -race -count=1 -timeout 300s ./...
        working-directory: guard

  k8s-manifests:
    name: kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
      - name: render and validate both overlays
        run: |
          for o in dev mock; do
            kubectl kustomize deploy/k8s/overlays/$o | ./kubeconform -strict -summary -kubernetes-version 1.33.0 -
          done
      - name: validate monitoring manifests (ServiceMonitor, PrometheusRule)
        run: |
          kubectl kustomize deploy/k8s/monitoring | ./kubeconform -strict -summary -kubernetes-version 1.33.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -
      - name: dashboard JSON is generated from tools/dashboard/gen.py
        run: |
          python3 tools/dashboard/gen.py
          git diff --exit-code deploy/k8s/monitoring/freeloader-dashboard.json
      - run: for f in deploy/kind/*.sh; do bash -n "$f"; done
